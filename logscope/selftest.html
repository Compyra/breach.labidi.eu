<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logscope self-test</title>
    <!--
      Dev-only harness. Feeds synthetic exports of every supported format
      through parse.js and rules.js and asserts the results, so the tool can be
      verified without needing real tenant evidence.

      Not linked from anywhere and not in the service worker shell.
      Open /logscope/selftest.html and read the page.
    -->
    <link rel="stylesheet" href="../style.css?v=1">
    <style>
        body {
            padding: 1.5rem;
        }

        .pass {
            color: #5fd39b;
        }

        .fail {
            color: #ff6b6b;
            font-weight: 700;
        }

        li {
            font-family: ui-monospace, monospace;
            font-size: .85rem;
            margin: .2rem 0;
        }
    </style>
</head>

<body>
    <h1>Logscope self-test</h1>
    <p id="summary" class="lede">running…</p>
    <ul id="results"></ul>
    <div id="toast" class="toast"></div>
    <!-- app.js boots against this, so the self-test executes the UI file too;
         a syntax error in it once shipped because nothing here loaded it. -->
    <main id="out" hidden></main>

    <script>
        window.__SCRIPT_ERRORS = [];
        window.addEventListener('error', function (e) {
            var msg = (e.filename || '?') + ': ' + e.message;
            window.__SCRIPT_ERRORS.push(msg);
            /* Surface it immediately: headless dumps cannot wait for the
               suite's own render if the async chain has already died. */
            var s = document.getElementById('summary');
            if (s) s.textContent = 'SCRIPT ERROR: ' + msg;
        });
        window.addEventListener('unhandledrejection', function (e) {
            var msg = 'unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
            window.__SCRIPT_ERRORS.push(msg);
            var s = document.getElementById('summary');
            if (s) s.textContent = 'SCRIPT ERROR: ' + msg;
        });
    </script>
    <script src="../core.js?v=1"></script>
    <script src="../data-logs.js?v=1"></script>
    <script src="parse.js?v=1"></script>
    <script src="split.js?v=1"></script>
    <script src="rules.js?v=1"></script>
    <script src="app.js?v=1"></script>
    <script>
        (function () {
            'use strict';
            const results = [];
            const ok = (name, cond, extra) => results.push({ name, cond: !!cond, extra: extra || '' });

            /* ---------------- fixtures ---------------- */

            const signinJson = JSON.stringify([
                {
                    createdDateTime: '2026-07-28T09:14:02Z', userPrincipalName: 'jo@contoso.com',
                    ipAddress: '203.0.113.9', location: { countryOrRegion: 'NL' },
                    appDisplayName: 'Microsoft Office', resourceDisplayName: 'Microsoft Graph',
                    authenticationProtocol: 'deviceCode', conditionalAccessStatus: 'notApplied',
                    status: { errorCode: 0 }, isInteractive: true, userAgent: 'python-requests/2.31',
                    authenticationDetails: [{ authenticationMethod: 'Password', succeeded: true }],
                    riskLevelDuringSignIn: 'none', deviceDetail: {}, userType: 'Member'
                },
                {
                    createdDateTime: '2026-07-28T09:31:44Z', userPrincipalName: 'jo@contoso.com',
                    ipAddress: '198.51.100.7', location: { countryOrRegion: 'SG' },
                    appDisplayName: 'Office 365 Exchange Online', status: { errorCode: 0 },
                    isInteractive: false, conditionalAccessStatus: 'success',
                    authenticationDetails: [{ authenticationStepResultDetail: 'MFA requirement satisfied by claim in the token, previously satisfied' }],
                    riskLevelDuringSignIn: 'high', deviceDetail: {}, userType: 'Member'
                },
                {
                    createdDateTime: '2026-07-28T08:00:00Z', userPrincipalName: 'ann@contoso.com',
                    ipAddress: '198.51.100.7', location: { countryOrRegion: 'BR' },
                    appDisplayName: 'Exchange ActiveSync', clientAppUsed: 'Exchange ActiveSync',
                    status: { errorCode: 0 }, isInteractive: true, deviceDetail: {}, userType: 'Guest'
                }
            ]);

            const auditJson = JSON.stringify({
                value: [
                    {
                        activityDateTime: '2026-07-28T09:40:10Z', activityDisplayName: 'Add service principal',
                        category: 'ApplicationManagement', result: 'success',
                        initiatedBy: { user: { userPrincipalName: 'jo@contoso.com', ipAddress: '198.51.100.7' } },
                        targetResources: [{ displayName: 'Mail Backup Pro', type: 'ServicePrincipal', modifiedProperties: [] }]
                    },
                    {
                        activityDateTime: '2026-07-28T09:41:02Z',
                        activityDisplayName: 'Add service principal credentials', result: 'success',
                        initiatedBy: { user: { userPrincipalName: 'jo@contoso.com', ipAddress: '198.51.100.7' } },
                        targetResources: [{ displayName: 'Mail Backup Pro', modifiedProperties: [{ displayName: 'KeyDescription', oldValue: '[]', newValue: '["expires 2099"]' }] }]
                    },
                    {
                        activityDateTime: '2026-07-28T10:02:00Z', activityDisplayName: 'Set domain authentication',
                        result: 'success', initiatedBy: { user: { userPrincipalName: 'adm@contoso.com', ipAddress: '198.51.100.7' } },
                        targetResources: [{ displayName: 'contoso.com' }]
                    },
                    {
                        activityDateTime: '2026-07-28T11:00:00Z', activityDisplayName: 'Admin registered security info',
                        result: 'success', initiatedBy: { user: { userPrincipalName: 'help@contoso.com', ipAddress: '10.1.1.5' } },
                        targetResources: [{ userPrincipalName: 'cfo@contoso.com' }]
                    }
                ]
            });

            /* Purview CSV with a quoted AuditData JSON column containing commas
               and escaped quotes: the case a naive split destroys. */
            const ualCsv = 'CreationDate,UserIds,Operations,AuditData\r\n' +
                '2026-07-28T09:45:00Z,jo@contoso.com,New-InboxRule,' +
                '"{""CreationTime"":""2026-07-28T09:45:00"",""Operation"":""New-InboxRule"",""ClientIP"":""198.51.100.7"",""UserId"":""jo@contoso.com"",""Workload"":""Exchange"",""Parameters"":[{""Name"":""Name"",""Value"":"".""},{""Name"":""MoveToFolder"",""Value"":""RSS Feeds""},{""Name"":""SubjectContainsWords"",""Value"":""invoice, payment""}]}"\r\n' +
                '2026-07-28T09:50:00Z,jo@contoso.com,MailItemsAccessed,' +
                '"{""CreationTime"":""2026-07-28T09:50:00"",""Operation"":""MailItemsAccessed"",""ClientIP"":""198.51.100.7"",""UserId"":""jo@contoso.com"",""MailAccessType"":""Sync"",""Folders"":[{""Path"":""\\\\Inbox"",""FolderItems"":[{""InternetMessageId"":""<a@b>""}]}]}"\r\n';

            const traceCsv = 'date_time,sender_address,recipient_address,subject,status,from_ip\r\n' +
                Array.from({ length: 30 }, (_, i) =>
                `2026-07-28T10:0${i % 10}:00Z,jo@contoso.com,victim${i}@partner.com,"Invoice, updated",Delivered,198.51.100.7`).join('\r\n') + '\r\n';

            const signinCsv = '"Date (UTC)","Username","Application","IP address","Location","Status","Sign-in error code","Client app","Authentication Protocol","Conditional Access","Multifactor authentication result"\r\n' +
                '"2026-07-28T12:00:00Z","bob@contoso.com","Azure Portal","203.0.113.44","US","Success","0","Browser","","Success","MFA requirement satisfied by claim in the token"\r\n' +
                '"2026-07-28T13:00:00Z","eve@contoso.com","Microsoft Office","203.0.113.80","FR","Failure","50199","Browser","","",""\r\n' +
                '"2026-07-28T13:07:00Z","eve@contoso.com","Microsoft Office","198.51.100.99","FR","Success","0","Browser","","Success",""\r\n';

            /* ---------------- format detection ---------------- */

            const rSignin = LS_PARSE.parseText(signinJson, 'signins.json');
            ok('sign-in JSON detected', rSignin.kind === 'signin', rSignin.kind);
            ok('sign-in JSON row count', rSignin.events.length === 3, rSignin.events.length);
            ok('device code protocol parsed', rSignin.events[0].proto === 'deviceCode', rSignin.events[0].proto);
            ok('prior-claim MFA detected', rSignin.events.some(e => e.mfa === 'prior'));

            const rAudit = LS_PARSE.parseText(auditJson, 'audit.json');
            ok('audit JSON detected (value wrapper)', rAudit.kind === 'audit', rAudit.kind);
            ok('audit rows', rAudit.events.length === 4, rAudit.events.length);
            ok('audit modifiedProperties captured', (rAudit.events[1].extra.mods || []).length === 1);

            const rUal = LS_PARSE.parseText(ualCsv, 'ual.csv');
            ok('UAL CSV detected', rUal.kind === 'ual', rUal.kind);
            ok('UAL rows', rUal.events.length === 2, rUal.events.length);
            ok('AuditData unpacked: ClientIP', rUal.events[0].actorIp === '198.51.100.7', rUal.events[0].actorIp);
            ok('AuditData unpacked: parameters with embedded comma',
                (rUal.events[0].extra.params.SubjectContainsWords || '') === 'invoice, payment',
                rUal.events[0].extra.params.SubjectContainsWords);
            ok('MailItemsAccessed Sync captured', rUal.events[1].extra.mailAccessType === 'Sync');

            const rTrace = LS_PARSE.parseText(traceCsv, 'trace.csv');
            ok('message trace detected', rTrace.kind === 'trace', rTrace.kind);
            ok('trace rows', rTrace.events.length === 30, rTrace.events.length);

            const rSigninCsv = LS_PARSE.parseText(signinCsv, 'signins.csv');
            ok('sign-in CSV detected', rSigninCsv.kind === 'signin', rSigninCsv.kind);
            ok('sign-in CSV prior claim', rSigninCsv.events[0].mfa === 'prior', rSigninCsv.events[0].mfa);
            ok('sign-in CSV error code kept', rSigninCsv.events[1].result === 'failure 50199', rSigninCsv.events[1].result);

            ok('garbage does not throw', (function () {
                try { LS_PARSE.parseText('%%%not a log%%%', 'x.txt'); return true; } catch (e) { return false; }
            })());
            ok('empty handled', LS_PARSE.parseText('', 'e.txt').kind === 'empty');

            /* The Authentication Details tab export: method and result per
               step, no user or IP columns. Schema from a real export. */
            const rAuth = LS_PARSE.parseText(
                'Request ID,Date,Authentication method,Authentication method detail,Succeeded,Result detail,Requirement\n' +
                'dda13589-d867-4e9a-901e-50c262c25c00,2026-07-28T11:42:50Z,Password,Password Hash Sync,true,Correct password,\n' +
                '0b66bae6-aba4-41f3-8741-9064efb95500,2026-07-17T14:55:17Z,Previously satisfied,,true,First factor requirement satisfied by claim in the token,00000000-0000-0000-0000-000000000002\n' +
                'aa11aa11-0000-0000-0000-000000000000,2026-07-16T08:00:00Z,Password,Password Hash Sync,false,Invalid username or password or Invalid on-premise username or password.,\n',
                'InteractiveSignIns_AuthDetails_x.csv');
            ok('auth-details export detected', rAuth.kind === 'signin-auth' && rAuth.events.length === 3,
                rAuth.kind + '/' + rAuth.events.length);
            ok('auth step carries method, result detail and the claim marker',
                rAuth.events[1].mfa === 'prior' && rAuth.events[2].result.indexOf('failure') === 0 &&
                rAuth.events[0].extra.requestId === 'dda13589-d867-4e9a-901e-50c262c25c00',
                rAuth.events[1].mfa + '/' + rAuth.events[2].result);

            /* Two cities in one country are one country, not two. */
            const rLoc = LS_PARSE.parseText(
                'Date (UTC),Username,IP address,Application,Location,Status\n' +
                '2026-07-28T11:00:00Z,kim@x.be,81.164.55.10,Office,"Merelbeke, Oost-Vlaanderen, BE",Success\n' +
                '2026-07-28T12:00:00Z,kim@x.be,81.164.55.11,Office,"Gent, Oost-Vlaanderen, BE",Success\n',
                'signins.csv');
            ok('country is the country, not the city',
                rLoc.events[0].country === 'BE' && rLoc.events[1].country === 'BE' &&
                rLoc.events[0].extra.location === 'Merelbeke, Oost-Vlaanderen, BE',
                rLoc.events[0].country + '/' + rLoc.events[0].extra.location);
            ok('the original rows survive for the rows view',
                rLoc.table && rLoc.table.total === 2 && rLoc.table.header[4] === 'Location' &&
                rLoc.table.rows[0][4] === 'Merelbeke, Oost-Vlaanderen, BE',
                rLoc.table && JSON.stringify(rLoc.table.header));

            /* Zoneless UAL timestamps are UTC; parsing them as local time
               misaligns them against zoned Entra rows. */
            const rTz = LS_PARSE.parseText(
                'CreationDate,UserIds,Operations,AuditData\n' +
                '2026-08-11T09:15:00,a@example.org,UserLoggedIn,"{""CreationTime"":""2026-08-11T09:15:00"",""Operation"":""UserLoggedIn"",""UserId"":""a@example.org""}"',
                'tz.csv');
            ok('analyser reads zoneless UAL timestamps as UTC',
                rTz.events[0].ts && rTz.events[0].ts.toISOString() === '2026-08-11T09:15:00.000Z',
                rTz.events[0].ts && rTz.events[0].ts.toISOString());
            const rTz2 = LS_PARSE.parseText(
                '[{"userPrincipalName":"a@example.org","appDisplayName":"App","createdDateTime":"2026-08-11T09:15:00+02:00","status":{"errorCode":0}}]',
                'z.json');
            ok('analyser keeps explicit zone offsets',
                rTz2.events[0].ts && rTz2.events[0].ts.toISOString() === '2026-08-11T07:15:00.000Z',
                rTz2.events[0].ts && rTz2.events[0].ts.toISOString());

            /* ---------------- rules ---------------- */

            const all = [].concat(rSignin.events, rAudit.events, rUal.events, rTrace.events, rSigninCsv.events).sort((a, b) => (a.ts ? a.ts.getTime(): 0) - (b.ts ? b.ts.getTime(): 0));
            const findings = LS_RULES.run(all);
            const has = id => findings.some(f => f.id === id);

            ok('rule: device code', has('device-code'));
            ok('rule: token prior claim', has('token-prior-claim'));
            ok('rule: legacy auth', has('legacy-auth'));
            ok('rule: CA not applied', has('ca-not-applied'));
            ok('rule: risky sign-in', has('risky-signin'));
            ok('rule: guest sign-in', has('guest-signin'));
            ok('rule: outbound burst', has('outbound-burst'));
            ok('rule: sign-in then persistence chain', has('chain'));
            ok('rule: 50199 interrupt then success', has('interrupt-then-success'));
            ok('rule: fast travel pairs countries', (function () {
                const f = findings.filter(x => x.id === 'fast-travel')[0];
                return f && f.groups.some(g => /NL then SG|SG then NL/.test(g.detail));
            })());

            ok('catalogue: Add service principal', has('op:Add service principal'));
            ok('catalogue: credentials added', has('op:Add service principal credentials'));
            ok('catalogue: federation change', has('op:Set domain authentication'));
            ok('catalogue: inbox rule', has('op:New-InboxRule'));
            ok('catalogue: MailItemsAccessed', has('op:MailItemsAccessed'));
            ok('catalogue: helpdesk reset', has('op:Admin registered security info'));

            ok('severities ordered critical first', findings.length && findings[0].sev === 'critical', findings[0] && findings[0].sev);
            ok('every finding has actions', findings.every(f => f.actions && f.actions.length));
            ok('every finding link resolves to a real page path',
                findings.every(f => !f.link || f.link.indexOf('../') === 0));

            /* catalogue name matching tolerance */
            ok('en-dash operation matches',
                !!LS_RULES.catalogueLookup('Update application – Certificates and secrets management'));
            ok('hyphen variant matches',
                !!LS_RULES.catalogueLookup('Update application - Certificates and secrets management'));
            ok('case/space insensitive', !!LS_RULES.catalogueLookup(' set domain authentication '));
            ok('similar names do not collide',
                LS_RULES.catalogueLookup('Add service principal') !== LS_RULES.catalogueLookup('Add service principal credentials'));

            /* coverage */
            const gapsPartial = LS_RULES.coverage(rSignin.events);
            ok('coverage flags missing audit logs', gapsPartial.some(g => /audit logs/i.test(g.text)));
            ok('coverage flags missing purview', gapsPartial.some(g => /purview/i.test(g.text)));

            /* ---------------- table splitter ---------------- */

            /* Feed the streaming parser in awkward slices: a quoted field with
               commas, escaped quotes and a newline, cut at every boundary. */
            [1, 3, 7, 13, 64].forEach(function (size) {
                const csv = 'a,b,c\r\n1,"he said ""go, now""\nsecond line",3\r\n4,5,6\r\n';
                const rows = [];
                const st = LS_SPLIT.makeCsvStream(function (r) { rows.push(r.slice()); });
                for (let i = 0; i < csv.length; i += size) st.push(csv.slice(i, i + size));
                st.end();
                const good = rows.length === 3 &&
                    rows[1][1] === 'he said "go, now"\nsecond line' &&
                    rows[1][2] === '3' && rows[2][0] === '4';
                ok('stream CSV survives a ' + size + '-char chunk boundary', good,
                    JSON.stringify(rows).slice(0, 110));
            });

            ok('stream CSV strips the BOM', (function () {
                const rows = [];
                const st = LS_SPLIT.makeCsvStream(function (r) { rows.push(r.slice()); });
                st.push('\ufeffx,y\r\n1,2\r\n');
                st.end();
                return rows[0][0] === 'x';
            })());

            ok('csv cell quotes and escapes',
                LS_SPLIT.csvCell('a,b"c') === '"a,b""c"', LS_SPLIT.csvCell('a,b"c'));

            ok('IPv4 port stripped', LS_SPLIT.cleanIp('198.51.100.7:51142') === '198.51.100.7');
            ok('IPv6 brackets and port stripped',
                LS_SPLIT.cleanIp('[2001:db8::1]:443') === '2001:db8::1',
                LS_SPLIT.cleanIp('[2001:db8::1]:443'));
            ok('impossible octet rejected', LS_SPLIT.validIp('999.1.1.1') === false);
            ok('a clock time is not an IPv6 address', LS_SPLIT.isIpv6('09:45:00') === false);
            ok('a real IPv6 address still passes', LS_SPLIT.isIpv6('2001:db8::1') === true);
            ok('full-form IPv6 passes', LS_SPLIT.isIpv6('2001:0db8:0000:0000:0000:0000:0000:0001') === true);
            ok('two double-colons rejected', LS_SPLIT.isIpv6('2001::db8::1') === false);
            ok('trailing lone colon rejected', LS_SPLIT.isIpv6('2001:db8::1:') === false);
            ok('leading lone colon rejected', LS_SPLIT.isIpv6(':db8:1') === false);
            ok('bracketed IPv6 with port still resolves',
                LS_SPLIT.cleanIp('[2001:db8::1]:51142') === '2001:db8::1');

            /* IP scoping: private is static knowledge, microsoft comes from a
               user-loaded ranges file, everything else is public. */
            ok('private ranges are recognised',
                LS_SPLIT.isPrivateIp('192.168.1.10') && LS_SPLIT.isPrivateIp('10.0.0.1') &&
                LS_SPLIT.isPrivateIp('172.20.1.1') && LS_SPLIT.isPrivateIp('fe80::1') &&
                LS_SPLIT.isPrivateIp('fd00::5') && !LS_SPLIT.isPrivateIp('8.8.8.8') && !LS_SPLIT.isPrivateIp('20.50.71.38'));
            (function () {
                const ranges = LS_SPLIT.parseCidrList('{"values":[{"properties":{"addressPrefixes":["20.0.0.0/8","2603:1000::/24","999.1.1.1/8"]}}]}');
                ok('cidr list parsed from ServiceTags-style JSON', ranges.v4.length === 1 && ranges.v6.length === 1, ranges.count);
                const scope = LS_SPLIT.makeScope(ranges);
                ok('a datacenter IPv4 classifies as microsoft', scope('20.50.71.38') === 'microsoft', scope('20.50.71.38'));
                ok('a datacenter IPv6 classifies as microsoft', scope('2603:1026:c0a:1821::5') === 'microsoft', scope('2603:1026:c0a:1821::5'));
                ok('private beats every range', scope('192.168.1.10') === 'private');
                ok('everything else is public', scope('8.8.8.8') === 'public');
                const bare = LS_SPLIT.makeScope(null);
                ok('without a ranges file nothing is microsoft', bare('20.50.71.38') === 'public');

                /* Overlapping ranges once broke the interval search: a probe
                   landed on a narrow inner range and missed the broad one. */
                const overlapping = LS_SPLIT.parseCidrList('20.0.0.0/8 20.1.0.0/16 20.2.3.0/24 30.0.0.0/8');
                ok('overlapping ranges coalesce', overlapping.v4.length === 2, overlapping.v4.length);
                const merged = LS_SPLIT.mergeCidrSets(
                    LS_SPLIT.parseCidrList('2603:1026:5::/48 2620:1ec::/36'),
                    LS_SPLIT.parseCidrList('2603:1000::/24'));
                const mScope = LS_SPLIT.makeScope(merged);
                ok('a broad v6 range still matches beside narrower ones',
                    mScope('2603:1026:c0a:1821::5') === 'microsoft', mScope('2603:1026:c0a:1821::5'));
            })();

            /* Excel-facing cells truncate with a marker; raw cells must not,
               because original-rows.csv is re-ingested and JSON does not
               survive a cut. */
            (function () {
                const long = 'x'.repeat(40000);
                ok('excel cell truncates with a marker',
                    LS_SPLIT.csvCell(long).indexOf('...[truncated]') > 0);
            })();

            /* UAL timestamps carry no zone designator but are UTC. */
            ok('zoneless timestamp parses as UTC',
                LS_SPLIT.parseUtc('2026-07-28T10:00:00') === Date.parse('2026-07-28T10:00:00Z'));
            ok('zoned timestamp unchanged',
                LS_SPLIT.parseUtc('2026-07-28T10:00:00Z') === Date.parse('2026-07-28T10:00:00Z'));
            ok('date-only filter boundary is UTC midnight',
                LS_SPLIT.parseUtc('2026-07-28') === Date.parse('2026-07-28T00:00:00Z'));

            (function () {
                const ad = {
                    Operation: 'MailItemsAccessed',
                    ClientIP: '198.51.100.7:51142',
                    UserId: 'jo@contoso.com',
                    Folders: [{ Path: '\\Inbox', FolderItems: [{ InternetMessageId: '<a@b>' }] }],
                    Parameters: [{ Name: 'SubjectContainsWords', Value: 'invoice, payment' }],
                    ExtendedProperties: [{ Name: 'OriginatingServer', Value: 'SRV1 (203.0.113.44)' }],
                    Session: { DeviceIp: '10.20.30.40' }
                };
                const flat = LS_SPLIT.flatten(ad, '', {});
                ok('flatten nests with dotted paths', flat['Session.DeviceIp'] === '10.20.30.40',
                    JSON.stringify(flat).slice(0, 110));
                ok('flatten leaves child arrays to their own tables',
                    flat['Parameters'] === undefined && flat['Folders'] === undefined);
                const ips = LS_SPLIT.harvestIps(flat, JSON.stringify(ad));
                ok('IP harvested from ClientIP', ips.indexOf('198.51.100.7') >= 0, ips.join(','));
                ok('IP harvested from a nested object', ips.indexOf('10.20.30.40') >= 0, ips.join(','));
                ok('IP harvested from free text in the JSON', ips.indexOf('203.0.113.44') >= 0, ips.join(','));

                /* Name/value pair arrays become Family.Name columns. */
                const dev = LS_SPLIT.flatten({
                    DeviceProperties: [{ Name: 'OS', Value: 'Windows 11' }, { Name: 'BrowserType', Value: 'Edge 126' }],
                    ExtendedProperties: [{ Name: 'UserAgent', Value: 'Mozilla/5.0' }],
                    ModifiedProperties: [{ Name: 'Role', OldValue: 'User', NewValue: 'Admin' }],
                }, '', {});
                ok('flatten collapses name/value pairs into columns',
                    dev['DeviceProperties.OS'] === 'Windows 11' && dev['ExtendedProperties.UserAgent'] === 'Mozilla/5.0',
                    JSON.stringify(dev).slice(0, 120));
                ok('flatten leaves old/new value arrays to their own table',
                    dev['ModifiedProperties.Role'] === undefined);
                ok('column templates are published', !!(LS_SPLIT.TEMPLATES && LS_SPLIT.TEMPLATES.device && LS_SPLIT.TEMPLATES.all));
                ok('derived columns are declared for the UI',
                    !!(LS_SPLIT.DERIVED_COLS && LS_SPLIT.DERIVED_COLS.RowId && LS_SPLIT.DERIVED_COLS.AllIPs));
                const dup = LS_SPLIT.flatten({ P: [{ Name: 'X', Value: '1' }, { Name: 'X', Value: '2' }] }, '', {});
                ok('repeated names keep every value', dup['P.X'] === '1; 2', dup['P.X']);

                /* Excel executes cells starting with = + - @ as formulas. */
                ok('formula cell is neutralised for Excel', LS_SPLIT.csvCell('=1+1') === "'=1+1", LS_SPLIT.csvCell('=1+1'));
                ok('at-cell is neutralised for Excel', LS_SPLIT.csvCell('@cmd') === "'@cmd", LS_SPLIT.csvCell('@cmd'));

            /* ---------------- end to end, asynchronous ---------------- */

            /* Headless dumps advance virtual time freely while FileReader and
               Blob promises are pending; a live timer pins the clock to small
               steps so the dump cannot happen before the chain finishes.
               Cleared in render(), which every terminal path calls. */
            const KEEPALIVE = setInterval(function () { }, 25);

            const splitCsv = (function () {
                const ad1 = JSON.stringify({
                    CreationTime: '2026-07-28T09:45:00', Id: 'r1', Operation: 'New-InboxRule',
                    UserId: 'jo@contoso.com', Workload: 'Exchange', ClientIP: '198.51.100.7',

                });
                const ad2 = JSON.stringify({
                    CreationTime: '2026-07-28T10:00:00', Id: 'r2', Operation: 'MailItemsAccessed',
                    UserId: 'ann@contoso.com', Workload: 'Exchange', ClientIP: '203.0.113.9',
                    Folders: [{ Path: '\\Inbox', FolderItems: [{ InternetMessageId: '<m1>' }, { InternetMessageId: '<m2>' }] }]
                });
                /* r3 is bigger than the 32,767-character Excel cell cap, to prove
                   original-rows.csv carries it uncut and re-parseable. */

                    CreationTime: '2026-07-28T11:00:00', Id: 'r3', Operation: 'MailItemsAccessed',
                    UserId: 'jo@contoso.com', Workload: 'Exchange', ClientIP: '198.51.100.7',
                    Folders: [{ Path: '\\Inbox', FolderItems: [{ InternetMessageId: '<m3>', Subject: 'S'.repeat(40000) }] }]
                });
                /* r4 has unparseable AuditData but still contains an address. */
                const ad4 = '{ this is not json but it mentions 10.99.99.99 anyway';
                const q = function (x) { return '"' + x.replace(/"/g, '""') + '"'; };
                return 'CreationDate,UserIds,Operations,AuditData\r\n' +
                    '2026-07-28T09:45:00Z,jo@contoso.com,New-InboxRule,' + q(ad1) + '\r\n' +
                    '2026-07-28T10:00:00Z,ann@contoso.com,MailItemsAccessed,' + q(ad2) + '\r\n' +
                    '2026-07-28T11:00:00Z,jo@contoso.com,MailItemsAccessed,' + q(ad3) + '\r\n' +
                    '2026-07-28T12:00:00Z,sam@contoso.com,UserLoggedIn,' + q(ad4) + '\r\n';
            })();
            const splitFile = new File([splitCsv], 'ual.csv', { type: 'text/csv' });

            function byName(tables) {
                const m = {};
                (tables || []).forEach(function (t) { m[t.filename] = t; });
                return m;
            }

            LS_SPLIT.splitUal(splitFile, {}, {
                progress: function () { },
                error: function (m) { ok('split runs without error', false, m); render(); },
                done: function (tables, stats) {
                    const t = byName(tables);
                    ok('split: all four records written', stats.matched === 4, stats.matched);
                    ok('split: the broken row is counted as unparsed', stats.unparsed === 1, stats.unparsed);
                    ok('split: records table produced', !!t['records.csv']);
                    ok('split: parameters lifted into their own table',
                        t['parameters.csv'] && t['parameters.csv'].rows === 2,
                        t['parameters.csv'] && t['parameters.csv'].rows);
                    ok('split: joined tables mark their copied join columns',
                        t['parameters.csv'].addedCols === 6 && t['Actor.csv'].addedCols === 6,
                        t['parameters.csv'].addedCols + '/' + t['Actor.csv'].addedCols);
                    ok('split: ip-summary carries the scope class',
                        t['ip-summary.csv'].header[1] === 'Scope',
                        t['ip-summary.csv'].header.join(','));
                    ok('split: mail items lifted into their own table',
                        t['mail-items.csv'] && t['mail-items.csv'].rows === 3,
                        t['mail-items.csv'] && t['mail-items.csv'].rows);
                    ok('split: IP summary covers parsed and unparsed rows',
                        t['ip-summary.csv'] && t['ip-summary.csv'].rows === 3,
                        t['ip-summary.csv'] && t['ip-summary.csv'].rows);
                    ok('split: original rows keep the export schema (4 data rows)',
                        t['original-rows.csv'] && t['original-rows.csv'].rows === 4,
                        t['original-rows.csv'] && t['original-rows.csv'].rows);
                    ok('split: empty tables are omitted', !t['modified-properties.csv']);
                    ok('split: results carry a sample of each table',
                        t['records.csv'].sample.length === 4 && t['records.csv'].header[0] === 'RowId' &&

                    /* The oversized record must survive original-rows.csv uncut

                    t['original-rows.csv'].blob.text().then(function (text) {
                        ok('split: original rows carry the oversized cell uncut',

                        ok('split: original rows re-ingest as UAL', re.kind === 'ual' && re.events.length === 4,

                                                        const rp = tP.filter(function (x) { return x.filename === 'records.csv'; })[0];
                                                        ok('split: preview carries sample rows',

                                                        /* Exact vs prefix IP semantics: 203.0.113.5 must not
                                                           catch 203.0.113.55; a dotted prefix catches both. */

                                                            progress: function () { },
                                                            error: function (m) { ok('split: exact ip filter runs', false, m); render(); },
                                                            done: function (tE, sE) {
                                                                ok('split: a complete IP matches exactly, not as substring', sE.matched === 2, sE.matched);
                                                                LS_SPLIT.splitUal(devFile, { ip: '203.0.113.' }, {
                                                                    progress: function () { },
                                                                    error: function (m) { ok('split: prefix ip filter runs', false, m); render(); },
                                                                    done: function (tX, sX) {
                                                                        ok('split: a dotted prefix matches the family', sX.matched === 3, sX.matched);
                                                                        const noAdFile = new File(['Time,User,Action\r\n2026-07-29T08:00:00Z,kim@contoso.com,Login\r\n'], 'other.csv', { type: 'text/csv' });
                                                                        LS_SPLIT.splitUal(noAdFile, {}, {
                                                                            progress: function () { },
                                                                            error: function (m) { ok('split: non-UAL file runs', false, m); render(); },
                                                                            done: function (tN, sN) {
                                                                                ok('split: a file without AuditData is flagged', sN.noAuditData === true && sN.unparsed === 1,
                                                                                    sN.noAuditData + '/' + sN.unparsed);

                                                                                /* A discovered array named like a fixed table must not
                                                                                   overwrite it in the download folder. */
                                                                                const clashAd = JSON.stringify({
                                                                                    CreationTime: '2026-07-29T08:00:00', Id: 'c1', Operation: 'Op',
                                                                                    UserId: 'kim@contoso.com',
                                                                                    Records: [{ A: 1 }, { A: 2 }]
                                                                                });
                                                                                const clashFile = new File(['CreationDate,UserIds,Operations,AuditData\r\n' +
                                                                                    '2026-07-29T08:00:00Z,kim@contoso.com,Op,"' + clashAd.replace(/"/g, '""') + '"\r\n'], 'c.csv', { type: 'text/csv' });
                                                                                LS_SPLIT.splitUal(clashFile, {}, {
                                                                                    progress: function () { },
                                                                                    error: function (m) { ok('split: filename clash run works', false, m); render(); },
                                                                                    done: function (tC) {
                                                                                        const names = tC.map(function (x) { return x.filename.toLowerCase(); });
                                                                                        ok('split: a discovered table never collides with a fixed filename',
                                                                                            names.indexOf('records-2.csv') >= 0 && names.filter(function (x) { return x === 'records.csv'; }).length === 1,
                                                                                            names.join(','));

                                                                                        /* A JSON export converts on the fly: one object, one row. */
                                                                                        const jsonFile = new File(['[\n{"CreationTime":"2026-07-30T08:00:00","Operation":"UserLoggedIn","UserId":"kim@contoso.com","ClientIP":"203.0.113.7","Actor":[{"ID":"kim@contoso.com","Type":0}]},\n{"CreationTime":"2026-07-30T09:00:00","Operation":"New-InboxRule","UserId":"kim@contoso.com","ClientIP":"203.0.113.7"}\n]'], 'export.json', { type: 'application/json' });
                                                                                        LS_SPLIT.splitUal(jsonFile, { columns: { AllIPs: false, Workload: false, RowId: false } }, {
                                                                                            progress: function () { },
                                                                                            error: function (m) { ok('split: json input runs', false, m); render(); },
                                                                                            done: function (tJ, sJ) {
                                                                                                ok('split: a JSON export becomes table rows',
                                                                                                    sJ.jsonSource === true && sJ.rows === 2 && sJ.matched === 2 && sJ.unparsed === 0,
                                                                                                    sJ.rows + '/' + sJ.matched + '/' + sJ.unparsed);
                                                                                                const bj = {};
                                                                                                tJ.forEach(function (x) { bj[x.filename] = x; });
                                                                                                ok('split: json rows discover their arrays too',
                                                                                                    bj['Actor.csv'] && bj['Actor.csv'].rows === 1, bj['Actor.csv'] && bj['Actor.csv'].rows);
                                                                                                const hj = bj['records.csv'].header;
                                                                                                ok('split: unticked columns leave records.csv, RowId cannot',
                                                                                                    hj.indexOf('AllIPs') < 0 && hj.indexOf('Workload') < 0 && hj[0] === 'RowId' && sJ.userDropped === 2,
                                                                                                    hj.slice(0, 6).join(',') + ' dropped=' + sJ.userDropped);
                                                                                                bj['original-rows.csv'].blob.text().then(function (txt) {
                                                                                                    const rej = LS_PARSE.parseText(txt, 'original-rows.csv');
                                                                                                    ok('split: converted JSON reloads into the analyser',
                                                                                                        rej.kind === 'ual' && rej.events.length === 2, rej.kind + '/' + rej.events.length);

                                                                                                    /* ---------- flat mode: complete rows, never split by column ---------- */
                                                                                                    function shellCheckAndFinish() {
                                                                                                        /* The offline shell must be installable: one bad path
                                                                                                           aborts the whole service worker install atomically. */
                                                                                                        fetch('../sw.js').then(function (r) { return r.text(); }).then(function (sw) {
                                                                                                            const shell = (sw.match(/'(\.\/[^']*)'/g) || []).map(function (x) { return x.slice(3, -1); });
                                                                                                            ok('sw: shell list found', shell.length > 15, shell.length);
                                                                                                            return Promise.all(shell.map(function (u) {
                                                                                                                return fetch('../' + u).then(function (r) { return r.ok ? null : u; }).catch(function () { return u; });
                                                                                                            }));
                                                                                                        }).then(function (results) {
                                                                                                            const broken = results.filter(function (x) { return x; });
                                                                                                            ok('sw: every shell entry resolves, so the offline install cannot abort',
                                                                                                                broken.length === 0, broken.join(', '));
                                                                                                            /* By now DOMContentLoaded has fired and app.js has
                                                                                                               booted, so parse AND runtime errors are visible. */
                                                                                                            ok('every script parsed and booted without errors',
                                                                                                                window.__SCRIPT_ERRORS.length === 0, window.__SCRIPT_ERRORS.join(' | '));
                                                                                                            ok('the UI module exposed its API', !!(window.LOGSCOPE && window.LOGSCOPE.report));
                                                                                                            render();
                                                                                                        });
                                                                                                    }

                                                                                                    LS_SPLIT.splitUal(splitFile, { flat: true, tables: { ipsummary: false, subset: false } }, {
                                                                                                        progress: function () { },
                                                                                                        error: function (m) { ok('split: flat mode runs', false, m); render(); },
                                                                                                        done: function (tF, sF) {
                                                                                                            ok('flat: one file with complete rows', tF.length === 1 && tF[0].filename === 'events-flat.csv',
                                                                                                                tF.map(function (x) { return x.filename; }).join(','));
                                                                                                            ok('flat: mail items expand to their own lines (4 records, 5 lines)',
                                                                                                                tF[0].rows === 5 && sF.mailExpanded === 1, tF[0].rows + '/' + sF.mailExpanded);
                                                                                                            const h = tF[0].header;
                                                                                                            ok('flat: row starts with the original export columns',
                                                                                                                h[0] === 'RowId' && h[1] === 'CreationDate' && h[4] === 'AuditData' && h[5] === 'AllIPs',
                                                                                                                h.slice(0, 6).join(','));
                                                                                                            ok('flat: unpacked columns are marked from the boundary',
                                                                                                                tF[0].unpackedFrom === 6, tF[0].unpackedFrom);
                                                                                                            /* the correlation the mode exists for: message + IP on ONE line */
                                                                                                            const im = h.indexOf('Item.InternetMessageId');
                                                                                                            const ci = h.indexOf('ClientIP');
                                                                                                            const line = tF[0].sample.filter(function (r) { return r[im] === '<m2>'; })[0];
                                                                                                            ok('flat: a mail item and its IP share one row',
                                                                                                                !!line && line[ci] === '203.0.113.9' && line[h.indexOf('CreationDate')] !== '',
                                                                                                                line ? line[ci] : 'row not found');

                                                                                                            LS_SPLIT.splitUal(splitFile, { flat: true, flatSplit: true, tables: { ipsummary: false, subset: false } }, {
                                                                                                                progress: function () { },
                                                                                                                error: function (m) { ok('split: flat workload split runs', false, m); render(); },

                                                                                                                    ok('flat: rows split by workload, columns never',
